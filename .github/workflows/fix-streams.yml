name: Auto-fix Dead Streams

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-streams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install requests playwright

      # Used to watch what a broadcaster's own player requests, which is the
      # only reliable way to get the stream URL off a JS-driven live page.
      - name: Install Chromium for browser probing
        run: playwright install --with-deps chromium

      - name: Find and replace dead streams
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fix_streams.py

      - name: Commit fixes if any
        run: |
          if ! git diff --quiet -- index.m3u; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.m3u
            git commit -m "fix(auto): replace dead streams with working alternatives"
            git push
          else
            echo "No changes to commit."
          fi
